# Fix 8: credentials and unsafe JPA settings externalized to environment variables.
# Override at deploy time: DB_USER, DB_PASSWORD, DB_URL, JPA_DDL_AUTO, JPA_SHOW_SQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evya}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.root=INFO
logging.level.com.evya=DEBUG

# --- SENSE-004: time-driven evaluation ---
# Rules that detect absence cannot run from the ingestion path; this sweep runs whether or not a
# charger sent anything.
sense.sweep-interval-ms=${SENSE_SWEEP_INTERVAL_MS:30000}
sense.silence-threshold-seconds=${SENSE_SILENCE_THRESHOLD_SECONDS:300}
# CSMS log lines carry IST wall-clock timestamps with no offset, parsed into a zone-less LocalDateTime.
# "Now" must be produced in the same zone or every elapsed-time comparison is wrong on a UTC host.
sense.log-zone=${SENSE_LOG_ZONE:Asia/Kolkata}

# --- SEC-004: operator authentication ---
# The business API's JWT secret: EvyaSense validates the same operator access tokens as the OCPP server.
# Required; the service refuses to start without it (min 32 chars, known defaults refused).
jwt.secret=${JWT_SECRET:}
# Token roleIds allowed to use the operator API (mirrors the OCPP operator rule).
sense.auth.operator-role-ids=${SENSE_OPERATOR_ROLE_IDS:1,4,6}
# Portal origins allowed to call the operator API cross-origin, comma-separated. Empty = none.
sense.cors.allowed-origins=${SENSE_CORS_ALLOWED_ORIGINS:}
# Raw Redis inspection endpoints (/api/redis/inspect). Off unless explicitly enabled.
sense.debug-endpoints.enabled=${SENSE_DEBUG_ENDPOINTS:false}
# URL ingest: public https sources only, size-capped.
sense.ingest.allow-private-targets=false
sense.ingest.allow-plain-http=false
sense.ingest.max-bytes=104857600
