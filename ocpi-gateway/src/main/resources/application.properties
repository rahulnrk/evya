spring.application.name=evya-ocpi-gateway
server.port=${OCPI_PORT:8082}

# --- Datastore (gateway owns its schema; it never shares tables with the platform DB) ---
spring.datasource.url=${OCPI_DB_URL:jdbc:mysql://localhost:3307/ocpi_db?createDatabaseIfNotExist=true}
spring.datasource.username=${OCPI_DB_USER:root}
spring.datasource.password=${OCPI_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${OCPI_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Identity of this deployment ---
# Public base URL partners are given; must be the externally reachable https origin in production.
ocpi.public-base-url=${OCPI_PUBLIC_BASE_URL:http://localhost:8082}

# --- Secrets: supplied by the environment, never committed ---
# 32 random bytes, base64. Generate: openssl rand -base64 32
ocpi.token.encryption-key=${OCPI_TOKEN_KEY:}
# The role played on the roaming network (ADR-002): CPO first.
ocpi.default-role=${OCPI_DEFAULT_ROLE:CPO}

# ADR-003: the portal-facing OCPI API (/portal/**) trusts the business API's operator JWT.
# This must be the same secret the backend and OCPP sign with. Startup fails if it is unset.
platform.jwt-secret=${PLATFORM_JWT_SECRET:}
# The platform admin role id (portal convention: 1). A vendor admin is scoped to its own vendor.
platform.roles.admin=${PLATFORM_ROLE_ADMIN:1}

# Outbound calls to partner platforms
ocpi.client.connect-timeout-ms=${OCPI_CLIENT_CONNECT_TIMEOUT_MS:5000}
ocpi.client.read-timeout-ms=${OCPI_CLIENT_READ_TIMEOUT_MS:15000}

logging.level.root=INFO
logging.level.com.evya.ocpi=INFO

# How long a minted Token A stays usable before the handshake (hours).
ocpi.token-a.ttl-hours=${OCPI_TOKEN_A_TTL_HOURS:168}
