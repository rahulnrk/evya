# Lab/test profile only. These values are deliberately fake and must never be used anywhere else.
spring.datasource.url=jdbc:h2:mem:ocpi;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

ocpi.public-base-url=https://ocpi.test.invalid

# Test-only key: 32 bytes, base64. Production keys come from the secret store (OCPI_TOKEN_KEY).
ocpi.token.encryption-key=ZXZ5YS1vY3BpLXRlc3Qta2V5LTAxMjM0NTY3ODlhYmM=
ocpi.admin.api-key=test-operator-key

# The fake partner in the tests runs on loopback over plain http.
ocpi.client.allow-private-targets=true
ocpi.client.allow-plain-http=true
ocpi.client.connect-timeout-ms=2000
ocpi.client.read-timeout-ms=4000

logging.level.com.evya.ocpi=DEBUG
