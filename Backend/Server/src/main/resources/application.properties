# JWT (SEC-2b) — REQUIRED. No weak default. App refuses to start if JWT_SECRET is missing/short/known-weak.
# Generate: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# OTP / Redis (SEC-1). Set otp.use-redis=false for pure in-memory (single node / tests).
otp.use-redis=${OTP_USE_REDIS:false}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# CORS allowed origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://portal.evyaa.com,https://web.evyaa.com}

http.port=${HTTP_PORT:8211}
http.servlet.session.timeout=60
http.servlet.session.cookie.max-age=60
http.error.include-message=always
server.port=${SERVER_PORT:8800}

# Secrets and endpoints — set via environment or application-local.properties (not committed)
grok.api.key=${GROK_API_KEY:}
grok.api.url=${GROK_API_URL:https://api.x.ai/v1/chat/completions}

phonepe.auth-url=${PHONEPE_AUTH_URL:https://api-preprod.phonepe.com/apis/pg-sandbox/v1/oauth/token}
phonepe.pay-url=${PHONEPE_PAY_URL:https://api-preprod.phonepe.com/apis/pg-sandbox/checkout/v2/pay}
#phonepe.redirect-url=http://localhost:8080/api/phonepe/callback
phonepe.status-url=${PHONEPE_STATUS_URL:https://api-preprod.phonepe.com/apis/pg-sandbox/checkout/v2/order}

phonepe.client-id=${PHONEPE_CLIENT_ID:}
phonepe.client-secret=${PHONEPE_CLIENT_SECRET:}
phonepe.client-version=${PHONEPE_CLIENT_VERSION:1}

spring.datasource.driverClassName=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/test_evya?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=root
