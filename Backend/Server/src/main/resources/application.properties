spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#////////////////////////////////////////////uncomment for previous db////////////////////////////////////////
# Hibernate
hibernate.dialect: org.hibernate.dialect.SQLServerDialect
hibernate.show_sql: false
hibernate.hbm2ddl.auto: update
hibernate.packagesToScan: com.ewe.pojo
hibernate.enable_lazy_load_no_trans=true
hibernate.jdbc.batch_size = 50
hibernate.jdbc.time_zone=UTC

spring.main.banner-mode=off
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.debug=${MAIL_SMTP_DEBUG:false}
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
hibernate.search.default.directory_provider=filesystem
hibernate.search.default.indexBase=${HIBERNATE_SEARCH_INDEX_BASE:C:/hibernate/lucence/indexes}
hibernate.search.default.indexwriter.infostream=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method

# Beckn Configuration
beckn.default.search.radius.km=10
beckn.default.page.size=10
beckn.domain=nic2004:52110
beckn.city=Bengaluru
beckn.country=IND

twilio.AccountSID=${TWILIO_ACCOUNT_SID:}
twilio.AuthToken=${TWILIO_AUTH_TOKEN:}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER:}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

admin.email=${ADMIN_EMAIL:}
admin.name=${ADMIN_NAME:Admin}
rfid.unit.price=${RFID_UNIT_PRICE:300}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.secret.key=${RAZORPAY_SECRET_KEY:}

# ADR-003: per-vendor product. Role ids must match the production role table (portal convention:
# 1 platform admin, 3 vendor/white-label admin, 4 franchise owner). Confirm before deploy.
platform.roles.admin=${PLATFORM_ROLE_ADMIN:1}
platform.roles.vendor-admin=${PLATFORM_ROLE_VENDOR_ADMIN:3}
platform.roles.franchise-owner=${PLATFORM_ROLE_FRANCHISE_OWNER:4}
