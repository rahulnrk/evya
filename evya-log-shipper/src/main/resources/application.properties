spring.application.name=evya-log-shipper

# --- What to tail ---
# Each immediate subdirectory is one charger; the directory name is the OCPPId and becomes the Kafka key.
shipper.root=${SHIPPER_ROOT:/home/ubuntu/logs/stationLogs}
shipper.topic=${SHIPPER_TOPIC:evya-sense-topic}
shipper.state-file=${SHIPPER_STATE_FILE:shipper-state.properties}
shipper.poll-interval-ms=${SHIPPER_POLL_INTERVAL_MS:2000}
# true: on first sight of a file start at its end. false: backfill existing logs.
shipper.start-at-end=${SHIPPER_START_AT_END:true}
shipper.max-bytes-per-poll=${SHIPPER_MAX_BYTES_PER_POLL:1048576}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

logging.level.root=INFO
logging.level.com.evya.shipper=INFO
